name: Publish to npm

# Tokenless publishing via npm trusted publishing (OIDC): the registry
# authenticates this workflow from the trusted-publisher connection
# configured on the package — no npm tokens stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC identity npm verifies

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.15.
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install rendering browser (tests render real frames)
        run: npx playwright-core install chromium

      # The release gate runs explicitly here (lint, typecheck, schema, all
      # tests) — kept out of npm lifecycle scripts so installs never spawn it.
      - name: Verify release
        run: npm run verify:release

      - name: Check whether this version is already published
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "storeshot-cli@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::storeshot-cli@$v is already on the registry — nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # A GitHub release with an already-published version is an operator
      # error (forgotten version bump) — fail loudly. A manual re-dispatch
      # of a published version is a harmless no-op — skip quietly.
      - name: Fail a release cut on an already-published version
        if: github.event_name == 'release' && steps.check.outputs.published == 'true'
        run: |
          echo "::error::package.json is still at an already-published version — bump it before cutting a release."
          exit 1

      - name: Publish with provenance
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance
